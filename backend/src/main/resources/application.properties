spring.application.name=backend

# MongoDB Configuration (Supports Atlas via URI env var, defaults to local)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/ocean_view_resort_db}

# Mailtrap Configuration
spring.mail.host=${SPRING_MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${SPRING_MAIL_PORT:2525}
spring.mail.username=${SPRING_MAIL_USERNAME:23e575503bd17b}
spring.mail.password=${SPRING_MAIL_PASSWORD:6f1b21f8e60876}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Security Configuration
oceanview.app.jwtSecret=${JWT_SECRET:oceanViewResortSecretKeyForJwtAuthenticationMustBeLongAndSecure}
oceanview.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# Google OAuth2 Configuration
google.client.id=${GOOGLE_CLIENT_ID:707866377438-20640dlhedfh63fu8iqot6n8394vp9mo.apps.googleusercontent.com}

# Multipart Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB